services:
  - type: web
    name: tfl-telegram-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: tfl-bot-db
          property: connectionString
    buildCommand: ""
    startCommand: ""

databases:
  - name: tfl-bot-db
    databaseName: tflbot
    user: tflbot
    plan: free
